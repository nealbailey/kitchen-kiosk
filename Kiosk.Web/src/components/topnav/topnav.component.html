<p-toast position="top-center" sticky="true"></p-toast> 
<div id="topnavDiv" class="topnav">
  <div class="topnav">
    <!--
      <a class="active" href="#home">Home</a>
      <a href="#">Popular</a>
      <a href="#">Submit</a>
    -->    
    <div class="topnav-right">
      <p-button *ngIf="userSessionService.userIsLoggedIn()" label="Add Recipe" icon="pi pi-plus-circle" styleClass="p-button-secondary" (click)="onCreateRecipeClicked()"></p-button>
      <p-button *ngIf="!userSessionService.userIsLoggedIn()" label="Login" icon="pi pi-lock" (click)="op.toggle($event)"></p-button>&nbsp;&nbsp;&nbsp;

      <p-overlayPanel #op [showCloseIcon]="true" [style]="{width: '300px'}">
        <ng-template pTemplate>
          <div class="p-field p-grid">
            <label for="txtUsername" class="p-col-fixed" style="width: 200px;">Username</label>
            <div class="p-col">
              <input #txtUsername id="txtUsername" pInputText type="text" maxlength="64" [(ngModel)]="username">
            </div>
          </div>
          <div class="p-field p-grid">
            <label for="txtPassword" class="p-col-fixed" style="width: 200px;">Password</label>
            <div class="p-col">
              <input #txtPassword id="txtPassword" pInputText type="password" maxlength="64" [(ngModel)]="password">
            </div>
          </div>
          <div class="p-field p-grid">
            <div class="p-col" style="margin-top:5px;">
              <p-button label="Submit" (click)="op.hide($event);onLoginClicked($event)"></p-button>&nbsp;
            </div>
          </div>
        </ng-template>
      </p-overlayPanel>

      <p-button *ngIf="userSessionService.userIsLoggedIn()" label="{{ homePageState.userSession.username }}" icon="pi pi-user" (click)="opLogout.toggle($event)"></p-button>

      <p-overlayPanel #opLogout [showCloseIcon]="true" [style]="{width: '200px'}">
        <button pButton pRipple type="button" label="Sign Out" class="p-button-outlined p-button-rounded" (click)="opLogout.hide($event);onLogoutClicked()"></button>
      </p-overlayPanel>
    </div>
  </div>
</div>
