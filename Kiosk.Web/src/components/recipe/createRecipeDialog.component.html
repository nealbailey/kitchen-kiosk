<!--<p-toast position="center" sticky="true"></p-toast>--> 
<div id="createRecipeDialogDiv">
  <div id="wizStepOne" *ngIf="homePageState.createRecipeDialogCurrentStep==1">
    <div class="p-field p-grid">      
      <div class="p-col">
        <label for="txtRecipeTitle" class="p-col-fixed" style="width:200px">Details</label>
        <input #txtRecipeTitle id="txtRecipeTitle" pInputText type="text" maxlength="64" style="width:60%" placeholder="Title" [(ngModel)]="homePageState.selectedRecipe.title" [class]="stateValidator.txtTitleStyle">&nbsp;&nbsp;
        <p-dropdown #ddlCategory id="ddlCategory" autoWidth="false" [options]="homePageState.categories" optionLabel="category" [style]="{'width':'35%'}" placeholder="Category" [(ngModel)]="homePageState.selectedRecipe.primaryCategory" [class]="stateValidator.ddlCategoryStyle" appendTo="body"></p-dropdown>
      </div>
    </div>
    <div class="p-field p-grid">
      <div class="p-col">
        <label for="txtDescription" class="p-col-fixed" style="width:200px;">Description</label>
        <textarea pInputTextarea id="txtDescription" autoWidth="false" [style]="{'width':'100%', 'height':'230px'}" [(ngModel)]="homePageState.selectedRecipe.description" [class]="stateValidator.txtDescriptionStyle"></textarea>
      </div>
    </div>
  </div>

  <div id="wizStepTwo" *ngIf="homePageState.createRecipeDialogCurrentStep==2">
    <div class="p-field p-grid">
      <div class="p-col">
        <label for="txtIngredients" class="p-col-fixed" style="width:200px;">Ingredients</label>
        <textarea pInputTextarea id="txtIngredients" autoWidth="false" [style]="{'width':'100%', 'height':'300px'}" [(ngModel)]="homePageState.selectedRecipe.strIngredients" [class]="stateValidator.txtIngredientsStyle"></textarea>
      </div>
    </div>
  </div>

  <div id="wizStepThree" *ngIf="homePageState.createRecipeDialogCurrentStep==3">
    <div class="p-field p-grid">
      <div class="p-col">
        <label for="txtDirections" class="p-col-fixed" style="width:200px;">Instructions</label>
        <p-editor id="txtDirections" [style]="{'height':'300px'}" [(ngModel)]="homePageState.selectedRecipe.instructions" [class]="stateValidator.txtDirectionsStyle">
          <ng-template pTemplate="header">
            <span class="ql-formats">
              <select class="ql-header">
                <option value="1">Heading</option>
                <option value="2">Subheading</option>
                <option selected>Normal</option>
              </select>
            </span>
            <span class="ql-formats">
              <button type="button" class="ql-bold" aria-label="Bold"></button>
              <button type="button" class="ql-italic" aria-label="Italic"></button>
              <button type="button" class="ql-underline" aria-label="Underline"></button>
            </span>
            <span class="ql-formats">
              <button type="button" class="ql-list" value="ordered" aria-label="Numbered List"></button>
              <button type="button" class="ql-list" value="bullet" aria-label="Bulleted List"></button>
            </span>
            <span class="ql-formats">
              <button type="button" class="ql-clean" aria-label="Remove Formatting"></button>
            </span>
          </ng-template>
        </p-editor>
      </div>
    </div>
  </div>
</div>
