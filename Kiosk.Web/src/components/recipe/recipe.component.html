<!--<p-toast position="center" sticky="true"></p-toast>-->
<div class="content">
  <div *ngIf="homePageState.pageIsLoading" [baseZIndex]="10000" style="z-index:10000">
    <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
  </div>
  <div class="w-container">
    <div class="post-title-section">
      <h1>{{recipe?.title}}</h1>
      <div class="post-info-wrapper">
        <div class="post-info">{{getLocalDateString(recipe?.date, true)}}</div>
        <div class="post-info">|</div>
        <a routerLink="/home"
           class="post-info when-link"
           (click)="onCategoryClicked(recipe?.primaryCategory?.catId, recipe?.primaryCategory?.category)">{{recipe?.primaryCategory?.category}}</a>
        <div class="post-info">|</div>
        <a routerLink="/home"
           class="post-info when-link"
           (click)="onUserClicked(recipe.user.id, recipe.user.userName)">{{recipe?.user?.userName}}</a>
      </div>
    </div>
    <div class="body-copy w-richtext">
     <p>{{recipe?.description}}</p>
    <div *ngIf="photos.length > 0" class="recipe-photos">
      <div *ngFor="let photo of photos | slice:0:5" class="recipe-photo">
        <a [href]="baseUrl + photo.imageUrl" target="_blank">
          <img [src]="baseUrl + photo.imageThumbUrl" [alt]="photo.fileName ?? ''" />
        </a>
      </div>
    </div>
        
    <h2>Ingredients</h2>
    <blockquote>
      <div *ngFor="let i of this.recipe.ingredients">
        <ul role="list">
          <li>{{i.ingredient}}</li>
        </ul>
      </div>
    </blockquote>
      <p>
        <h2>Instructions</h2>
        <div>
          <span [innerHtml]="recipe?.instructions"></span>
        </div>
    </div>
    <div class="button-wrapper">
      <button type="button" class="button w-button" (click)="onBackClicked()">←&nbsp;Back</button>
    </div>
  </div>
</div>
