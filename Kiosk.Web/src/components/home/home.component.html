<div id="homeDiv" class="content" role="main">
  <!--
  *************************************************************************************
  Spinner while loading the page
  *************************************************************************************
  -->
  <!--<p-dialog [draggable]="false" [resizable]="false" [(visible)]="homePageState.pageIsLoading" [modal]="true"
            [closeOnEscape]="false" closeable="false" [showHeader]="false"
            [baseZIndex]="10000">
    <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
  </p-dialog>-->
  <div *ngIf="homePageState.pageIsLoading" [baseZIndex]="10000" style="z-index:10000">
    <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
  </div>

  <div id="divFilters">
    <button pButton pRipple type="button" icon="pi pi-search" class="p-button-rounded p-button-success p-button-outlined" style="height: 2.5rem;width: 2.5rem; color: #808080;" (click)="onSearchClicked();"></button>
    &nbsp;<p-chip *ngIf="!homePageState.pageIsLoading" icon="pi pi-file" [label]="'Recipes: ' + this.homePageState.recipes.length" styleClass="mr-2"></p-chip>
    <p-chip [icon]="sortChipIcon" [label]="sortChipLabel" styleClass="mr-2"></p-chip>
    <p-chip *ngIf="this.homePageState?.pagingData.searchString" icon="pi pi-search" [label]="(this.homePageState.pagingData.searchType === 'ingredient' ? 'Ingredient: ' : '') + this.homePageState?.pagingData.searchString" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipSearch')"></p-chip>
    <p-chip *ngIf="this.homePageState?.pagingData.favoritesOnly === true" icon="pi pi-heart" label="My Favorites" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipFavorites')"></p-chip>
    <p-chip *ngIf="this.homePageState?.pagingData.categoryId > 0" icon="pi pi-book" [label]="this.homePageState?.pagingData.category" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipCategory')"></p-chip>
    <p-chip *ngIf="this.homePageState?.pagingData.userId" icon="pi pi-user" [label]="this.homePageState?.pagingData.userName" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipUser')"></p-chip>
  </div>
  <br/>
  <div class="filter-panel" *ngIf="this.homePageState.searchBarIsVisible">
    <div class="filter-group filter-group-search">
      <label class="filter-label">Search</label>
      <div class="filter-search-row">
        <input #txtHomeSearch id="txtHomeSearch" placeholder="search recipes" type="text" pInputText maxlength="50" [(ngModel)]="homePageState.pagingData.searchString" (input)="searchEntered($event.target)">
        <p-selectButton [options]="searchTypeOptions" optionLabel="label" optionValue="value" [(ngModel)]="homePageState.pagingData.searchType" (onChange)="onSearchTypeChanged()"></p-selectButton>
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">Category</label>
      <p-dropdown #ddlCategory id="ddlCategory" [options]="homePageState.categories" optionLabel="category" placeholder="All categories" [(ngModel)]="homePageState.selectedCategory" (onChange)="onCategoryClicked($event.value.catId, $event.value.category)"></p-dropdown>
    </div>

    <div class="filter-group">
      <label class="filter-label">Author</label>
      <p-dropdown #ddlUser id="ddlUser" [options]="homePageState.users" optionLabel="userName" placeholder="All authors" [(ngModel)]="homePageState.selectedUser" (onChange)="onUserClicked($event.value.id, $event.value.userName)"></p-dropdown>
    </div>

    <div class="filter-group">
      <label class="filter-label">Sort by</label>
      <p-selectButton [options]="sortColumnOptions" optionLabel="label" optionValue="value" [(ngModel)]="homePageState.pagingData.sortColumn" (onChange)="onSortChanged()"></p-selectButton>
    </div>

    <div class="filter-group">
      <label class="filter-label">Order</label>
      <p-selectButton [options]="sortOrderOptions" optionLabel="label" optionValue="value" [(ngModel)]="homePageState.pagingData.sortOrder" (onChange)="onSortChanged()"></p-selectButton>
    </div>
  </div>

  <p-confirmDialog header="Warning" icon="pi pi-exclamation-triangle"></p-confirmDialog>

  <div class="recipe-grid">
    <article class="recipe-card" *ngFor="let recipe of this.homePageState.recipes" (click)="onRecipeCardClicked(recipe)">
      <a routerLink="/recipe/{{recipe.recId}}" class="recipe-card-title-link" (click)="onRecipeClicked(); $event.stopPropagation()">
        <h2 class="recipe-card-title">
          {{recipe.title}}
          <i *ngIf="recipe.isRecommended" class="pi pi-thumbs-up recipe-card-recommended" title="Recommended"></i>
        </h2>
      </a>
      <div class="recipe-card-meta">
        <span class="recipe-card-date">{{getLocalDateString(recipe.date)}}</span>
        <button pButton pRipple type="button" label="{{recipe.primaryCategory.category}}" class="p-button-warning p-button-text p-button-sm" (click)="onCategoryClicked(recipe.primaryCategory.catId, recipe.primaryCategory.category); $event.stopPropagation()"></button>
        <button pButton pRipple type="button" label="{{recipe.user.userName}}" class="p-button-secondary p-button-text p-button-sm" (click)="onUserClicked(recipe.user.id, recipe.user.userName); $event.stopPropagation()"></button>
      </div>
      <p class="recipe-card-summary">
        {{recipe.description}}
      </p>
      <div class="recipe-card-actions" *ngIf="userSessionService.userIsLoggedIn()">
        <div class="recipe-card-action-group">
          <span [ngSwitch]="recipe.isFavorite">
            <button *ngSwitchCase="true" pButton pRipple type="button" icon="pi pi-heart" aria-label="Remove from favorites" class="p-button-rounded p-button-help p-button-sm" (click)="onRecipeFavoriteClicked(recipe); $event.stopPropagation()"></button>
            <button *ngSwitchCase="false" pButton pRipple type="button" icon="pi pi-heart" aria-label="Add to favorites" class="p-button-rounded p-button-help p-button-outlined p-button-sm" (click)="onRecipeFavoriteClicked(recipe); $event.stopPropagation()"></button>
          </span>
          <span *ngIf="userSessionService.userIsRecipeOwnerOrAdmin(recipe.user.userName)">
            <button pButton pRipple type="button" icon="pi pi-pencil" aria-label="Edit recipe" class="p-button-rounded p-button-success p-button-outlined p-button-sm" (click)="onRecipeEditClicked(recipe); $event.stopPropagation()"></button>
            <button pButton pRipple type="button" icon="pi pi-times" aria-label="Delete recipe" class="p-button-rounded p-button-danger p-button-outlined p-button-sm" (click)="onRecipeDeleteClicked(recipe.recId); $event.stopPropagation()"></button>
          </span>
        </div>
      </div>
    </article>
  </div>
  <div #infiniteScrollTrigger class="infinite-scroll-trigger" aria-hidden="true"></div>
  <div *ngIf="homePageState.isLoadingMoreRecipes" class="infinite-scroll-loading" role="status" aria-label="Loading more recipes">
    <p-progressSpinner [style]="{width: '36px', height: '36px'}" strokeWidth="6" fill="transparent" animationDuration=".5s"></p-progressSpinner>

  </div>

  <!--
  *************************************************************************************
  Add Recipe Dialog
  *************************************************************************************
  -->
  <p-dialog #createRecipeDialog [(visible)]="homePageState.createRecipeDialogIsVisible"
            [resizable]="false" [modal]="true"
            [style]="{'width': '45.5em','font-weight': '700'}">
    <ng-template pTemplate="header">
      <span style="display:flex; align-items:center;">
        <i class="pi pi-list" style="font-size:1.3rem; margin-right:0.5rem;"></i>
        <span class="dialog-head">{{ homePageState.selectedRecipe.recId > 0 ? 'Edit Recipe' : 'Create Recipe' }}</span></span>        
    </ng-template>
    <!-- <hr class="card-hr" />  -->
    <createRecipeDialog-root></createRecipeDialog-root>    
    <ng-template pTemplate="footer">
      <p-button label="Back" icon="pi pi-angle-left" styleClass="p-button-secondary" (click)="onCreateRecipeDialogPrevClicked()" [hidden]="this.homePageState.createRecipeDialogCurrentStep==1"></p-button>
      <p-button label="Next" icon="pi pi-angle-right" iconPos="right" (click)="onCreateRecipeDialogNextClicked()" [hidden]="this.homePageState.createRecipeDialogCurrentStep==3"></p-button>
      <p-button label="Save" icon="pi pi-save" [hidden]="this.homePageState.createRecipeDialogCurrentStep != 3" (click)="onCreateRecipeSaveClicked()"></p-button>
    </ng-template>
  </p-dialog>
</div>
