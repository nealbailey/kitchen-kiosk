<!--<p-toast position="center" sticky="true"></p-toast>-->
<div id="homeDiv" class="content" role="main">
  <div id="divFilters">
    <p-chip icon="pi pi-file" [label]="'Page: ' + this.homePageState?.pagingData.pageNumber" styleClass="mr-2"></p-chip>&nbsp;
    <p-chip *ngIf="this.homePageState?.pagingData.searchString" icon="pi pi-search" [label]="this.homePageState?.pagingData.searchString" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipSearch')"></p-chip>&nbsp;
    <p-chip *ngIf="this.homePageState?.pagingData.categoryId > 0" icon="pi pi-book" [label]="this.homePageState?.pagingData.category" styleClass="mr-2" [removable]="true" (onRemove)="onRemoveChip('chipCategory')"></p-chip>
  </div>

  <p></p>
  <div class="blog-list w-dyn-list">
    <div role="list" class="w-dyn-items">
      <!-- Start Posts Area -->
      <div role="listitem" class="w-dyn-item">
        <div class="post-wrapper" *ngFor="let recipe of this.homePageState.recipes">
          <a routerLink="/recipe/{{recipe.recId}}" class="blog-title-link w-inline-block">
            <h1 class="blog-title">{{recipe.title}}</h1>
          </a>
          <div class="post-info-wrapper">
            <div class="post-info">{{getLocalDateString(recipe.date)}}</div>
            <div class="post-info">|</div>
            <button pButton pRipple type="button" class="p-button-outlined p-button-rounded" (click)="onCategoryClicked(recipe.primaryCategory.catId, recipe.primaryCategory.category)">{{recipe.primaryCategory.category}}</button>
          </div>
          <p class="post-summary">
            {{recipe.description}}
          </p><a routerLink="/recipe/{{recipe.recId}}" class="button-round w-button">See Recipe →</a>
        </div>
      </div>
      <!-- End Posts -->

    </div>
  </div>
  <div class="button-wrapper">
    <a *ngIf="this.homePageState.pagingData.pageNumber !== 1" class="button w-button" (click)="onPrevPageClicked()">←&nbsp;Prev Page&nbsp;</a>&nbsp;&nbsp;
    <a *ngIf="this.homePageState.recipes.length >= this.homePageState.pagingData.pageSize" class="button w-button" (click)="onNextPageClicked()">Next Page&nbsp;→</a>
  </div>

  <!--
  *************************************************************************************
  Add Recipe Dialog
  *************************************************************************************
  -->
  <p-dialog #createRecipeDialog [(visible)]="homePageState.createRecipeDialogIsVisible"
            [resizable]="false" [modal]="true"
            [style]="{'width': '45.5em','font-weight': '700'}">
    <p-header>
      <i class="pi pi-send" style="font-size:1.3rem; margin-right:0.5rem;"></i>
      <span class="dialog-head">Create Recipe</span>
    </p-header>    
    <hr class="card-hr" />
    <createRecipeDialog-root></createRecipeDialog-root>
    <!--<hr class="card-hr" />-->
    <ng-template pTemplate="footer">
      <p-button label="Back" icon="pi pi-angle-left" styleClass="p-button-secondary" (click)="onCreateRecipeDialogPrevClicked()" [hidden]="this.homePageState.createRecipeDialogCurrentStep==1"></p-button>
      <p-button label="Next" icon="pi pi-angle-right" iconPos="right" (click)="onCreateRecipeDialogNextClicked()" [hidden]="this.homePageState.createRecipeDialogCurrentStep==3"></p-button>
      <p-button label="Save" icon="pi pi-save" [hidden]="this.homePageState.createRecipeDialogCurrentStep != 3" (click)="onCreateRecipeSaveClicked()"></p-button>
    </ng-template>
  </p-dialog>

  <!--
  *************************************************************************************
  Spinner while loading the page
  *************************************************************************************
  -->
  <p-dialog [draggable]="false" [resizable]="false" [(visible)]="homePageState.pageIsLoading" [modal]="true"
            [closeOnEscape]="false" closeable="false" [showHeader]="false"
            [baseZIndex]="10000">
    <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8" fill="var(--surface-ground)" animationDuration=".5s"></p-progressSpinner>
  </p-dialog>
