<div class="sidebar-column">
  <div data-collapse="medium" data-animation="default" data-duration="400" data-easing="ease" data-easing2="ease" role="banner" class="navigation-bar w-nav">
    <div class="w-container">
      <p-confirmDialog header="Access" icon="pi pi-id-card"></p-confirmDialog>

      <a href="#" class="logo-link w-nav-brand">
        <h1 class="logo-text">Kitchen Kiosk</h1>
      </a>
      <nav role="navigation" class="navigation-menu w-nav-menu">
        <p class="main-subheading w-hidden-medium w-hidden-small w-hidden-tiny">
          Welcome to the Bailey Family recipe database. This site will provide you with a comprensive set of traditional family recipes that are simple to make and taste great.
        </p>
        <div class="divider w-hidden-medium w-hidden-small w-hidden-tiny"></div>

        <!-- Sidebar nav -->
        <a routerLink="/home" aria-current="page" class="nav-link w-nav-link w--current" (click)="onHomeClicked()">Home</a>
        <a *ngIf="userSessionService.userIsLoggedIn()" routerLink="/home" aria-current="page" class="nav-link w-nav-link w--current" (click)="onFavoritesClicked()">My Favorites</a>
        <!--<a href="#" *ngIf="userSessionService.userIsLoggedIn()" class="nav-link w-nav-link">My Favorites</a>-->
        <a *ngIf="!userSessionService.userIsLoggedIn()" style="cursor: pointer" class="nav-link w-nav-link" (click)="onRequestAccessClicked()">Request Access</a>

        <div class="divider"></div>
        <input #txtSearch id="txtSearch" placeholder="search" type="text" pInputText maxlength="50" [(ngModel)]="this.homePageState?.pagingData.searchString" (input)="searchEntered($event.target)">
        <div class="divider"></div>

        <button #btn type="button" pButton icon="pi pi-bars" label="Recipes" (click)="menu.toggle($event)" class="p-button-secondary"></button>
        <p-slideMenu #menu [model]="sidebarMenuItems" [popup]="true" [viewportHeight]="250" appendTo="body"></p-slideMenu>
